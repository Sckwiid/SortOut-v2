<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SortOut — Accueil</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<div id="trailer-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog">
    <button class="modal-close" aria-label="Fermer">×</button>
    <h3 id="modal-title">Trailer</h3>
    <video id="modal-video" controls autoplay muted playsinline></video>
  </div>
</div>
<body>
<div class="page">
  <header>
    <h1>SortOut</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="tirage.html">Tirage depuis tes jeux Steam</a>
    </nav>
  </header>

  <main>
  <div class="cards-row">
    <div class="card" id="game-of-day">
      <h2>🎮 Jeu du jour</h2>
      <div class="content">Chargement…</div>
    </div>

    <div class="card" id="horror-of-day">
      <h2>👻 Jeu horreur du jour</h2>
      <div class="content">Chargement…</div>
    </div>
  </div>

  <section class="card quick-draw">
    <h2>🎲 Tirage rapide</h2>

    <div class="quick-controls">
      <div class="category-selector">
        <button type="button" class="btn btn-sm" id="quick-category-btn">
          Catégories ▾
        </button>
        <div class="category-menu hidden" id="quick-category-menu">
          <label class="category-option">
            <input type="checkbox" value="action">
            <span>⚔️ Action</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="aventure">
            <span>🧭 Aventure</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="horreur">
            <span>👻 Horreur</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="coop">
            <span>🤝 Coop</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="multijoueur">
            <span>🌐 Multijoueur</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="solo">
            <span>🎮 Solo</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="rpg">
            <span>🧙‍♂️ RPG</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="fps">
            <span>🎯 FPS</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="survie">
            <span>🧟 Survie</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="openworld">
            <span>🌍 Monde ouvert</span>
          </label>
        </div>
      </div>

      <div class="switch-column">
        <label class="switch-field">
          <span>Coop / Multi uniquement</span>
          <div class="switch">
            <input type="checkbox" id="quick-coop-toggle">
            <span class="switch-slider"></span>
          </div>
        </label>

        <label class="switch-field">
          <span>Solo uniquement</span>
          <div class="switch">
            <input type="checkbox" id="quick-solo-toggle">
            <span class="switch-slider"></span>
          </div>
        </label>

        <label class="switch-field">
          <span>Gratuit uniquement</span>
          <div class="switch">
            <input type="checkbox" id="quick-free-toggle">
            <span class="switch-slider"></span>
          </div>
        </label>
      </div>
    </div>

    <div class="quick-actions">
      <button type="button" class="btn" id="quick-draw-btn">
        Lancer le tirage
      </button>
    </div>

    <div class="quick-result" id="quick-result">
      <p class="placeholder">Choisis tes catégories et filtres, puis lance le tirage 🎲</p>
    </div>
  </section>

  <div class="main-actions">
    <a href="tirage.html" class="btn">🎲 Tirage depuis tes jeux Steam</a>
  </div>
</main>
</div>

<script>
const WORKER_BASE = 'https://steam-proxy.sckwiid.workers.dev';

// Jeux pour "Jeu du jour" (général)
const ALL_GAMES_POOL = [
  { appid: 730,   name: 'Counter-Strike 2' },
  { appid: 570,   name: 'Dota 2' },
  { appid: 440,   name: 'Team Fortress 2' },
  { appid: 620,   name: 'Portal 2' },
  { appid: 271590, name: 'Grand Theft Auto V' },
  { appid: 550,   name: 'Left 4 Dead 2' },
  { appid: 292030, name: 'The Witcher 3' },
  { appid: 578080, name: 'PUBG: Battlegrounds' },
  { appid: 359550, name: 'Rainbow Six Siege' },
  { appid: 252490, name: 'Rust' }
];

// Jeux pour "Jeu horreur du jour"
const HORROR_GAMES_POOL = [
  { appid: 550,    name: 'Left 4 Dead 2' },
  { appid: 238320, name: 'Outlast' },
  { appid: 319510, name: 'Layers of Fear' },
  { appid: 221100, name: 'DayZ' },
  { appid: 108600, name: 'Project Zomboid' },
  { appid: 17470,  name: 'Dead Space' },
  { appid: 418370, name: 'Outlast 2' },
  { appid: 381210, name: 'Dead by Daylight' }
];

// Pool pour le "Tirage rapide" avec tags pour les catégories
const QUICK_GAMES_POOL = [
  { appid: 292030, name: 'The Witcher 3', tags: ['rpg','aventure','openworld','solo','action'] },
  { appid: 730,    name: 'Counter-Strike 2', tags: ['fps','action','multijoueur'] },
  { appid: 550,    name: 'Left 4 Dead 2', tags: ['fps','action','horreur','coop','multijoueur','survie'] },
  { appid: 238320, name: 'Outlast', tags: ['horreur','solo'] },
  { appid: 381210, name: 'Dead by Daylight', tags: ['horreur','multijoueur','coop','survie'] },
  { appid: 578080, name: 'PUBG: Battlegrounds', tags: ['fps','action','multijoueur','survie','openworld'] },
  { appid: 1174180, name: 'Red Dead Redemption 2', tags: ['aventure','action','openworld','rpg','solo'] },
  { appid: 271590, name: 'Grand Theft Auto V', tags: ['action','openworld','multijoueur'] },
  { appid: 108600, name: 'Project Zomboid', tags: ['survie','openworld','horreur','multijoueur','coop'] },
  { appid: 440,   name: 'Team Fortress 2', tags: ['fps','action','multijoueur'] },
  { appid: 570,   name: 'Dota 2', tags: ['multijoueur'] },
  { appid: 620,   name: 'Portal 2', tags: ['aventure','coop','solo'] },
  { appid: 252490, name: 'Rust', tags: ['survie','openworld','multijoueur'] },
  { appid: 367520, name: 'Hollow Knight', tags: ['action','aventure','solo'] }
];

function escapeHtml(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ---------- Popup trailer ---------- */

function openTrailer(url, title) {
  if (!url) return;
  const modal = document.getElementById('trailer-modal');
  const video = document.getElementById('modal-video');
  const titleEl = document.getElementById('modal-title');

  titleEl.textContent = 'Trailer — ' + (title || '');
  video.src = url;
  video.currentTime = 0;
  video.play().catch(() => {});

  modal.classList.remove('hidden');
}

function closeTrailer() {
  const modal = document.getElementById('trailer-modal');
  const video = document.getElementById('modal-video');
  video.pause();
  video.removeAttribute('src');
  video.load();
  modal.classList.add('hidden');
}

function setupModalHandlers() {
  const modal = document.getElementById('trailer-modal');
  if (!modal) return;

  const backdrop = modal.querySelector('.modal-backdrop');
  const closeBtn = modal.querySelector('.modal-close');

  backdrop.addEventListener('click', closeTrailer);
  closeBtn.addEventListener('click', closeTrailer);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
      closeTrailer();
    }
  });
}

/* ---------- Utilitaires Steam ---------- */

async function fetchDetails(appid) {
  try {
    const res = await fetch(`${WORKER_BASE}/appdetails?appid=${appid}`);
    if (!res.ok) return null;
    const det = await res.json();
    const data = det[appid] && det[appid].data ? det[appid].data : (det.data || null);
    return data || null;
  } catch(e) {
    return null;
  }
}

function computePriceText(details) {
  if (!details) return 'Prix non disponible';
  if (details.is_free) return 'Gratuit';
  if (details.price_overview) {
    return (details.price_overview.final / 100).toFixed(2) + ' €';
  }
  return 'Payant';
}

function isGameFree(details) {
  return !!(details && (details.is_free || (details.price_overview && details.price_overview.final === 0)));
}

/* ---------- Jeu du jour (localStorage) ---------- */

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function pickRandom(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

function getDailyGame(mode, pool) {
  const key = `sortout-daily-${mode}`;
  const today = todayKey();

  try {
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    if (stored && stored.date === today && stored.appid) {
      return stored;
    }
  } catch (e) {}

  const g = pickRandom(pool);
  const entry = { date: today, appid: g.appid, name: g.name };
  try {
    localStorage.setItem(key, JSON.stringify(entry));
  } catch (e) {}
  return entry;
}

async function renderCard(cardSelector, mode) {
  const card = document.querySelector(cardSelector);
  const content = card.querySelector('.content');

  const pool = mode === 'horror' ? HORROR_GAMES_POOL : ALL_GAMES_POOL;
  const game = getDailyGame(mode, pool);

  content.textContent = 'Chargement…';

  const details = await fetchDetails(game.appid);
  const priceText = computePriceText(details);

  // Image header
  let imgHtml = '';
  if (details && details.header_image) {
    imgHtml = `<img class="game-header" src="${details.header_image}" alt="Image de ${escapeHtml(game.name)}">`;
  }

  // URL trailer (mp4)
  let trailerUrl = null;
  if (details && details.movies && details.movies.length) {
    const vid = details.movies[0];
    if (vid.mp4) {
      if (vid.mp4.max) trailerUrl = vid.mp4.max;
      else {
        const keys = Object.keys(vid.mp4);
        if (keys.length) trailerUrl = vid.mp4[keys[0]];
      }
    }
  }

  const storeUrl = `https://store.steampowered.com/app/${game.appid}`;

  content.innerHTML = `
    ${imgHtml}
    <p><strong>${escapeHtml(game.name)}</strong></p>
    <p><small>${escapeHtml(priceText)}</small></p>
    <div class="card-actions">
      <a class="btn btn-sm" href="${storeUrl}" target="_blank" rel="noopener noreferrer">
        Voir sur Steam
      </a>
      ${trailerUrl ? `
        <button class="btn btn-sm btn-outlined btn-trailer" type="button">
          Voir le trailer
        </button>
      ` : ''}
    </div>
  `;

  if (trailerUrl) {
    const btn = content.querySelector('.btn-trailer');
    if (btn) {
      btn.addEventListener('click', () => openTrailer(trailerUrl, game.name));
    }
  }
}

/* ---------- Tirage rapide : UI catégories ---------- */

function setupQuickUI() {
  const btn = document.getElementById('quick-category-btn');
  const menu = document.getElementById('quick-category-menu');
  if (!btn || !menu) return;

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('hidden');
  });

  document.addEventListener('click', (e) => {
    if (!menu.classList.contains('hidden') &&
        !menu.contains(e.target) &&
        e.target !== btn) {
      menu.classList.add('hidden');
    }
  });
}

function getSelectedCategories() {
  const menu = document.getElementById('quick-category-menu');
  if (!menu) return [];
  const checked = menu.querySelectorAll('input[type="checkbox"]:checked');
  return Array.from(checked).map(c => c.value);
}

function matchesQuickFilters(game, selectedCats, coopOnly, soloOnly) {
  const tags = game.tags || [];

  // Filtre catégories : si une ou plusieurs sélectionnées, on veut une intersection
  if (selectedCats.length > 0) {
    if (!tags.some(t => selectedCats.includes(t))) return false;
  }

  // Solo seulement : priorité sur le reste
  if (soloOnly) {
    if (!tags.includes('solo')) return false;
    // On exclut les jeux marqués coop/multi
    if (tags.includes('coop') || tags.includes('multijoueur')) return false;
    return true;
  }

  // Coop / Multi uniquement
  if (coopOnly) {
    if (!(tags.includes('coop') || tags.includes('multijoueur'))) return false;
  }

  return true;
}

/* ---------- Tirage rapide : logique ---------- */

async function runQuickDraw() {
  const resultEl = document.getElementById('quick-result');
  const quickCard = document.querySelector('.quick-draw');
  if (!resultEl) return;

  const selectedCats = getSelectedCategories();
  const coopOnly = document.getElementById('quick-coop-toggle')?.checked || false;
  const soloOnly = document.getElementById('quick-solo-toggle')?.checked || false;
  const freeOnly = document.getElementById('quick-free-toggle')?.checked || false;

  const candidates = QUICK_GAMES_POOL.filter(g =>
    matchesQuickFilters(g, selectedCats, coopOnly, soloOnly)
  );

  if (candidates.length === 0) {
    resultEl.innerHTML = `<p class="placeholder">
      Aucun jeu ne correspond à ces filtres. Ajoute des catégories ou désactive certains toggles.
    </p>`;
    if (quickCard) {
      quickCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }

  // on met le message AVANT le scroll
  resultEl.innerHTML = `<p class="placeholder">Recherche d'un jeu compatible avec tes filtres…</p>`;

  // Scroll en douceur vers la carte de tirage rapide
  if (quickCard) {
    setTimeout(() => {
      quickCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }

  let chosenGame = null;
  let chosenDetails = null;

  // On essaie plusieurs fois de trouver un jeu correspondant au filtre "gratuit"
  for (let i = 0; i < 25; i++) {
    const game = pickRandom(candidates);
    const details = await fetchDetails(game.appid);
    if (!details) {
      chosenGame = game;
      chosenDetails = null;
      continue;
    }

    if (freeOnly && !isGameFree(details)) {
      // pas gratuit, on continue à chercher
      chosenGame = game;
      chosenDetails = details;
      continue;
    }

    chosenGame = game;
    chosenDetails = details;
    break;
  }

  if (!chosenGame) {
    resultEl.innerHTML = `<p class="placeholder">
      Impossible de trouver un jeu pour ce tirage. Réessaie plus tard.
    </p>`;
    return;
  }

  const details = chosenDetails;
  const priceText = computePriceText(details);
  const freeFlag = isGameFree(details);

  // Image header
  let imgHtml = '';
  if (details && details.header_image) {
    imgHtml = `<img class="game-header" src="${details.header_image}" alt="Image de ${escapeHtml(chosenGame.name)}">`;
  }

  // URL trailer (mp4)
  let trailerUrl = null;
  if (details && details.movies && details.movies.length) {
    const vid = details.movies[0];
    if (vid.mp4) {
      if (vid.mp4.max) trailerUrl = vid.mp4.max;
      else {
        const keys = Object.keys(vid.mp4);
        if (keys.length) trailerUrl = vid.mp4[keys[0]];
      }
    }
  }

  let infoNote = '';
  if (freeOnly && !freeFlag) {
    infoNote = `<br><small>💡 Aucun jeu 100% gratuit n'a été trouvé, celui-ci peut être payant.</small>`;
  }

  const storeUrl = `https://store.steampowered.com/app/${chosenGame.appid}`;

  resultEl.innerHTML = `
    <div class="quick-result-card">
      ${imgHtml}
      <p><strong>${escapeHtml(chosenGame.name)}</strong></p>
      <p><small>${escapeHtml(priceText)}</small>${infoNote}</p>
      <div class="card-actions">
        <a class="btn btn-sm" href="${storeUrl}" target="_blank" rel="noopener noreferrer">
          Voir sur Steam
        </a>
        ${trailerUrl ? `
          <button class="btn btn-sm btn-outlined btn-trailer" type="button">
            Voir le trailer
          </button>
        ` : ''}
      </div>
    </div>
  `;

  if (trailerUrl) {
    const btn = resultEl.querySelector('.btn-trailer');
    if (btn) {
      btn.addEventListener('click', () => openTrailer(trailerUrl, chosenGame.name));
    }
  }
}

/* ---------- Init ---------- */

setupModalHandlers();
setupQuickUI();

document.getElementById('quick-draw-btn')?.addEventListener('click', runQuickDraw);

// Premier affichage des deux cartes du jour
renderCard('#game-of-day', 'all');
renderCard('#horror-of-day', 'horror');
</script>
</body>
</html>
