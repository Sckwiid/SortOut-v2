<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SortOut — Accueil</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header>
    <h1>SortOut</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="tirage.html">Tirage depuis tes jeux Steam</a>
      <!-- tes autres pages plus tard -->
    </nav>
  </header>

  <main>
    <div class="cards-row">
      <div class="card" id="game-of-day">
        <h2>🎮 Jeu du jour</h2>
        <div class="content">Chargement…</div>
        <button class="btn btn-outlined" id="refresh-game">Rafraîchir</button>
      </div>

      <div class="card" id="horror-of-day">
        <h2>👻 Jeu horreur du jour</h2>
        <div class="content">Chargement…</div>
        <button class="btn btn-outlined" id="refresh-horror">Rafraîchir</button>
      </div>
    </div>

    <div class="main-actions">
      <a href="tirage.html" class="btn">🎲 Tirage depuis tes jeux Steam</a>
      <label class="toggle">
        <input type="checkbox" id="show-free">
        Afficher uniquement les jeux gratuits
      </label>
    </div>
  </main>
</div>

<script>
const WORKER_BASE = 'https://steam-proxy.sckwiid.workers.dev/'; // ⚠️ remplace par ton URL exacte

function escapeHtml(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

async function loadRandom(tag, free) {
  const url = new URL(WORKER_BASE + '/random');
  if (tag) url.searchParams.set('tag', tag);
  if (typeof free === 'boolean') url.searchParams.set('free', free ? '1' : '0');

  const res = await fetch(url);
  if (!res.ok) throw new Error('Worker HTTP ' + res.status);
  return res.json();
}

async function renderCard(cardSelector, tag) {
  const card = document.querySelector(cardSelector);
  const content = card.querySelector('.content');
  const freeOnly = document.getElementById('show-free').checked;

  content.textContent = 'Chargement…';

  try {
    const data = await loadRandom(tag, freeOnly);
    const appid = data.appid || (data.fallback && data.fallback.appid);
    const name = data.name || (data.fallback && data.fallback.name) || 'Jeu inconnu';

    if (!appid) {
      content.textContent = 'Aucun résultat.';
      return;
    }

    let priceText = 'Prix non disponible';

    try {
      const detRes = await fetch(`${WORKER_BASE}/appdetails?appid=${appid}`);
      if (detRes.ok) {
        const det = await detRes.json();
        const obj = det[appid] && det[appid].data ? det[appid].data : (det.data || null);
        if (obj) {
          if (obj.is_free) priceText = 'Gratuit';
          else if (obj.price_overview) {
            priceText = (obj.price_overview.final / 100).toFixed(2) + ' €';
          } else priceText = 'Payant';
        }
      }
    } catch (_) {}

    content.innerHTML = `
      <p><strong>${escapeHtml(name)}</strong></p>
      <p><small>${priceText}</small></p>
      <p><a href="https://store.steampowered.com/app/${appid}" target="_blank">Voir sur Steam</a></p>
    `;
  } catch (e) {
    content.innerHTML = `<small>Erreur réseau avec le Worker. Vérifie l'URL WORKER_BASE.<br>${escapeHtml(e.message)}</small>`;
  }
}

document.getElementById('refresh-game').addEventListener('click', () =>
  renderCard('#game-of-day', null)
);
document.getElementById('refresh-horror').addEventListener('click', () =>
  renderCard('#horror-of-day', 'horror')
);
document.getElementById('show-free').addEventListener('change', () => {
  renderCard('#game-of-day', null);
  renderCard('#horror-of-day', 'horror');
});

// premier chargement
renderCard('#game-of-day', null);
renderCard('#horror-of-day', 'horror');
</script>
</body>
</html>
