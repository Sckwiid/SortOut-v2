<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SortOut — Accueil</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header>
    <h1>SortOut</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="tirage.html">Tirage depuis tes jeux Steam</a>
    </nav>
  </header>

  <main>
    <div class="cards-row">
      <div class="card" id="game-of-day">
        <h2>🎮 Jeu du jour</h2>
        <div class="content">Chargement…</div>
        <button class="btn btn-outlined" id="refresh-game">Rafraîchir</button>
      </div>

      <div class="card" id="horror-of-day">
        <h2>👻 Jeu horreur du jour</h2>
        <div class="content">Chargement…</div>
        <button class="btn btn-outlined" id="refresh-horror">Rafraîchir</button>
      </div>
    </div>

    <div class="main-actions">
      <a href="tirage.html" class="btn">🎲 Tirage depuis tes jeux Steam</a>
      <label class="toggle">
        <input type="checkbox" id="show-free">
        Afficher uniquement les jeux gratuits
      </label>
    </div>
  </main>
</div>

<script>
const WORKER_BASE = 'https://steam-proxy.sckwiid.workers.dev';

console.log('WORKER_BASE utilisé :', WORKER_BASE);

function escapeHtml(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

let catalogCache = null;

async function loadCatalog() {
  if (catalogCache) return catalogCache;
  const res = await fetch(WORKER_BASE + '/catalog');
  if (!res.ok) throw new Error('Worker /catalog HTTP ' + res.status);
  const data = await res.json();
  catalogCache = data.apps || [];
  return catalogCache;
}

async function pickRandomGame(tag, freeOnly) {
  const apps = await loadCatalog();
  if (!apps.length) throw new Error('Catalogue vide');

  let last = null;

  for (let i = 0; i < 40; i++) {
    const a = apps[Math.floor(Math.random() * apps.length)];
    if (!a || !a.appid) continue;
    last = a;

    // récupère les détails pour connaître prix + genres
    const detRes = await fetch(`${WORKER_BASE}/appdetails?appid=${a.appid}`);
    if (!detRes.ok) continue;
    const det = await detRes.json();

    const obj = det[a.appid] && det[a.appid].data ? det[a.appid].data : (det.data || null);
    if (!obj) continue;

    // filtre gratuit/payant
    if (typeof freeOnly === 'boolean') {
      const isFree = !!obj.is_free || (obj.price_overview && obj.price_overview.final === 0);
      if (freeOnly && !isFree) continue;
      if (!freeOnly && isFree) continue;
    }

    // filtre tag (horreur…)
    if (tag) {
      const lcTag = tag.toLowerCase();
      let matched = false;
      if (obj.genres) {
        matched = obj.genres.some(g => (g.description || '').toLowerCase().includes(lcTag));
      }
      if (!matched && obj.categories) {
        matched = obj.categories.some(c => (c.description || '').toLowerCase().includes(lcTag));
      }
      if (!matched) continue;
    }

    // trouvé
    return { appid: a.appid, name: obj.name, details: obj };
  }

  // fallback : dernier tiré, sans garantie de tag/gratuit
  if (last) {
    return { appid: last.appid, name: last.name || ('App ' + last.appid), details: null };
  }
  throw new Error('Impossible de trouver un jeu correspondant');
}

function formatPrice(details) {
  if (!details) return 'Prix non disponible';
  if (details.is_free) return 'Gratuit';
  if (details.price_overview) return (details.price_overview.final / 100).toFixed(2) + ' €';
  return 'Payant';
}

async function renderCard(cardSelector, tag) {
  const card = document.querySelector(cardSelector);
  const content = card.querySelector('.content');
  const freeOnly = document.getElementById('show-free').checked;

  content.textContent = 'Chargement…';

  try {
    const { appid, name, details } = await pickRandomGame(tag, freeOnly);
    const priceText = formatPrice(details);

    content.innerHTML = `
      <p><strong>${escapeHtml(name)}</strong></p>
      <p><small>${escapeHtml(priceText)}</small></p>
      <p><a href="https://store.steampowered.com/app/${appid}" target="_blank">Voir sur Steam</a></p>
    `;
  } catch (e) {
    content.innerHTML = `<small>Erreur : ${escapeHtml(e.message)}</small>`;
  }
}

document.getElementById('refresh-game').addEventListener('click', () =>
  renderCard('#game-of-day', null)
);
document.getElementById('refresh-horror').addEventListener('click', () =>
  renderCard('#horror-of-day', 'horror')
);
document.getElementById('show-free').addEventListener('change', () => {
  renderCard('#game-of-day', null);
  renderCard('#horror-of-day', 'horror');
});

// premier chargement
renderCard('#game-of-day', null);
renderCard('#horror-of-day', 'horror');
</script>
</body>
</html>
