<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SortOut — Accueil</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<div id="trailer-modal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-dialog">
    <button class="modal-close" aria-label="Fermer">×</button>
    <h3 id="modal-title">Trailer</h3>
    <video id="modal-video" controls autoplay muted playsinline></video>
  </div>
</div>
<body>
<div class="page">
  <header>
    <h1>SortOut</h1>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="tirage.html">Tirage depuis tes jeux Steam</a>
    </nav>
  </header>

  <main>
  <div class="cards-row">
    <div class="card" id="game-of-day">
      <h2>🎮 Jeu du jour</h2>
      <div class="content">Chargement…</div>
    </div>

    <div class="card" id="horror-of-day">
      <h2>👻 Jeu horreur du jour</h2>
      <div class="content">Chargement…</div>
    </div>
  </div>

  <section class="card quick-draw">
    <h2>🎲 Tirage rapide</h2>

    <div class="quick-controls">
      <div class="category-selector">
        <button type="button" class="btn btn-sm" id="quick-category-btn">
          Catégories ▾
        </button>
        <div class="category-menu hidden" id="quick-category-menu">
          <label class="category-option">
            <input type="checkbox" value="action">
            <span>⚔️ Action</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="aventure">
            <span>🧭 Aventure</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="horreur">
            <span>👻 Horreur</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="coop">
            <span>🤝 Coop</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="multijoueur">
            <span>🌐 Multijoueur</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="solo">
            <span>🎮 Solo</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="rpg">
            <span>🧙‍♂️ RPG</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="fps">
            <span>🎯 FPS</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="survie">
            <span>🧟 Survie</span>
          </label>
          <label class="category-option">
            <input type="checkbox" value="openworld">
            <span>🌍 Monde ouvert</span>
          </label>
        </div>
      </div>

      <label class="switch-field">
        <span>Gratuit uniquement</span>
        <div class="switch">
          <input type="checkbox" id="quick-free-toggle">
          <span class="switch-slider"></span>
        </div>
      </label>
    </div>

    <div class="quick-actions">
      <button type="button" class="btn" id="quick-draw-btn">
        Lancer le tirage
      </button>
    </div>

    <div class="quick-result" id="quick-result">
      <p class="placeholder">Choisis tes catégories puis lance le tirage 🎲</p>
    </div>
  </section>

  <div class="main-actions">
    <a href="tirage.html" class="btn">🎲 Tirage depuis tes jeux Steam</a>
  </div>
</main>
</div>

<script>
const WORKER_BASE = 'https://steam-proxy.sckwiid.workers.dev';

// Liste de jeux "génériques" pour le jeu du jour
const ALL_GAMES_POOL = [
  { appid: 730,   name: 'Counter-Strike 2' },
  { appid: 570,   name: 'Dota 2' },
  { appid: 440,   name: 'Team Fortress 2' },
  { appid: 620,   name: 'Portal 2' },
  { appid: 271590, name: 'Grand Theft Auto V' },
  { appid: 550,   name: 'Left 4 Dead 2' },
  { appid: 292030, name: 'The Witcher 3' },
  { appid: 578080, name: 'PUBG: Battlegrounds' },
  { appid: 359550, name: 'Rainbow Six Siege' },
  { appid: 252490, name: 'Rust' }
];

// Liste de jeux horreur pour la carte horreur
const HORROR_GAMES_POOL = [
  { appid: 550,    name: 'Left 4 Dead 2' },
  { appid: 238320, name: 'Outlast' },
  { appid: 319510, name: 'Layers of Fear' },
  { appid: 221100, name: 'DayZ' },
  { appid: 108600, name: 'Project Zomboid' },
  { appid: 17470,  name: 'Dead Space' },
  { appid: 418370, name: 'Outlast 2' },
  { appid: 381210, name: 'Dead by Daylight' }
];

function escapeHtml(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

/* ---------- Popup trailer ---------- */

function openTrailer(url, title) {
  if (!url) return;
  const modal = document.getElementById('trailer-modal');
  const video = document.getElementById('modal-video');
  const titleEl = document.getElementById('modal-title');

  titleEl.textContent = 'Trailer — ' + (title || '');
  video.src = url;
  video.currentTime = 0;
  video.play().catch(() => {});

  modal.classList.remove('hidden');
}

function closeTrailer() {
  const modal = document.getElementById('trailer-modal');
  const video = document.getElementById('modal-video');
  video.pause();
  video.removeAttribute('src');
  video.load();
  modal.classList.add('hidden');
}

function setupModalHandlers() {
  const modal = document.getElementById('trailer-modal');
  if (!modal) return;

  const backdrop = modal.querySelector('.modal-backdrop');
  const closeBtn = modal.querySelector('.modal-close');

  backdrop.addEventListener('click', closeTrailer);
  closeBtn.addEventListener('click', closeTrailer);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
      closeTrailer();
    }
  });
}

/* ---------- Jeu du jour (localStorage) ---------- */

function todayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function pickRandom(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

// Retourne le jeu du jour pour un "mode" (all / horror)
function getDailyGame(mode, pool) {
  const key = `sortout-daily-${mode}`;
  const today = todayKey();

  try {
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    if (stored && stored.date === today && stored.appid) {
      return stored;
    }
  } catch (e) {}

  const g = pickRandom(pool);
  const entry = { date: today, appid: g.appid, name: g.name };
  try {
    localStorage.setItem(key, JSON.stringify(entry));
  } catch (e) {}
  return entry;
}

async function fetchDetails(appid) {
  try {
    const res = await fetch(`${WORKER_BASE}/appdetails?appid=${appid}`);
    if (!res.ok) return null;
    const det = await res.json();
    const data = det[appid] && det[appid].data ? det[appid].data : (det.data || null);
    return data || null;
  } catch(e) {
    return null;
  }
}

function computePriceText(details) {
  if (!details) return 'Prix non disponible';
  if (details.is_free) return 'Gratuit';
  if (details.price_overview) {
    return (details.price_overview.final / 100).toFixed(2) + ' €';
  }
  return 'Payant';
}

async function renderCard(cardSelector, mode) {
  const card = document.querySelector(cardSelector);
  const content = card.querySelector('.content');

  const pool = mode === 'horror' ? HORROR_GAMES_POOL : ALL_GAMES_POOL;
  const game = getDailyGame(mode, pool);

  content.textContent = 'Chargement…';

  const details = await fetchDetails(game.appid);
  const priceText = computePriceText(details);

  // Image header
  let imgHtml = '';
  if (details && details.header_image) {
    imgHtml = `<img class="game-header" src="${details.header_image}" alt="Image de ${escapeHtml(game.name)}">`;
  }

  // URL trailer (mp4)
  let trailerUrl = null;
  if (details && details.movies && details.movies.length) {
    const vid = details.movies[0];
    if (vid.mp4) {
      if (vid.mp4.max) trailerUrl = vid.mp4.max;
      else {
        const keys = Object.keys(vid.mp4);
        if (keys.length) trailerUrl = vid.mp4[keys[0]];
      }
    }
  }

  const storeUrl = `https://store.steampowered.com/app/${game.appid}`;

  content.innerHTML = `
    ${imgHtml}
    <p><strong>${escapeHtml(game.name)}</strong></p>
    <p><small>${escapeHtml(priceText)}</small></p>
    <div class="card-actions">
      <a class="btn btn-sm" href="${storeUrl}" target="_blank" rel="noopener noreferrer">
        Voir sur Steam
      </a>
      ${trailerUrl ? `
        <button class="btn btn-sm btn-outlined btn-trailer" type="button">
          Voir le trailer
        </button>
      ` : ''}
    </div>
  `;

  // brancher le bouton trailer sur le popup
  if (trailerUrl) {
    const btn = content.querySelector('.btn-trailer');
    if (btn) {
      btn.addEventListener('click', () => openTrailer(trailerUrl, game.name));
    }
  }
}

/* ---------- UI Tirage rapide (juste l’UI pour l’instant) ---------- */

function setupQuickUI() {
  const btn = document.getElementById('quick-category-btn');
  const menu = document.getElementById('quick-category-menu');
  if (!btn || !menu) return;

  btn.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });

  // fermer le menu au clic à l'extérieur
  document.addEventListener('click', (e) => {
    if (!menu.classList.contains('hidden') &&
        !menu.contains(e.target) &&
        e.target !== btn) {
      menu.classList.add('hidden');
    }
  });
}

/* ---------- Init ---------- */

setupModalHandlers();
setupQuickUI();

// Premier affichage des deux cartes du jour
renderCard('#game-of-day', 'all');
renderCard('#horror-of-day', 'horror');
</script>
</body>
</html>
