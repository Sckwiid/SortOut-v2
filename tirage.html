<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Tirage — Tes jeux Steam</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header>
    <h1>Tirage — Tes jeux Steam</h1>
    <a href="index.html" class="link-back">← Accueil</a>
  </header>

  <main>
    <section class="card">
      <p>
        <label>
          Ton Steam vanity (ex: monpseudo) ou SteamID64 :
          <input type="text" id="vanity" placeholder="vanity ou steamid">
        </label>
        <button class="btn btn-outlined" id="loadLib">Charger ma bibliothèque</button>
      </p>
      <p><small>Ton profil doit être <strong>public</strong> pour que Steam renvoie tes jeux.</small></p>

      <hr>

      <label class="toggle">
        <input type="checkbox" id="onlyFree">
        Tirer uniquement parmi les jeux gratuits
      </label>

      <div id="libContainer">Aucune bibliothèque chargée.</div>

      <button class="btn" id="doDraw" disabled>🎲 Tirer au sort</button>
      <div id="result"></div>
    </section>
  </main>
</div>

<script>
const WORKER_BASE = 'https://steam-proxy.sckwiid.workers.dev/'; // ⚠️ remplace

const elLib = document.getElementById('libContainer');
const elResult = document.getElementById('result');
let currentGames = []; // {appid, name}

function escapeHtml(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}

async function resolveVanity(v) {
  const res = await fetch(`${WORKER_BASE}/resolve?vanity=${encodeURIComponent(v)}`);
  if (!res.ok) throw new Error('Worker HTTP ' + res.status);
  const j = await res.json();
  if (j.response && j.response.steamid) return j.response.steamid;
  throw new Error('Impossible de résoudre ce vanity (profil public ?)');
}

async function loadLibrary(steamid) {
  const res = await fetch(`${WORKER_BASE}/library?steamid=${encodeURIComponent(steamid)}`);
  if (!res.ok) throw new Error('Worker HTTP ' + res.status);
  const j = await res.json();
  if (!j.response || !j.response.games) throw new Error('Aucun jeu trouvé (profil privé ?)');
  return j.response.games.map(g => ({
    appid: g.appid,
    name: g.name || ('App ' + g.appid)
  }));
}

function renderLibrary(games) {
  if (!games.length) {
    elLib.textContent = 'Aucun jeu dans la bibliothèque.';
    document.getElementById('doDraw').disabled = true;
    return;
  }
  const container = document.createElement('div');
  games.forEach(g => {
    const div = document.createElement('div');
    div.className = 'game-row';
    const id = 'g_' + g.appid;
    div.innerHTML = `
      <label>
        <input type="checkbox" id="${id}" data-appid="${g.appid}" checked>
        ${escapeHtml(g.name)}
      </label>`;
    container.appendChild(div);
  });
  elLib.innerHTML = '';
  elLib.appendChild(container);
  document.getElementById('doDraw').disabled = false;
}

document.getElementById('loadLib').addEventListener('click', async () => {
  const v = document.getElementById('vanity').value.trim();
  if (!v) return alert('Renseigne ton vanity ou SteamID64.');

  elLib.textContent = 'Chargement…';
  elResult.innerHTML = '';

  try {
    const steamid = isNaN(Number(v)) ? await resolveVanity(v) : v;
    const games = await loadLibrary(steamid);
    currentGames = games;
    renderLibrary(games);
  } catch (e) {
    elLib.innerHTML = `<small>Erreur : ${escapeHtml(e.message)}.<br>
      Vérifie que ton profil est public et que l’URL WORKER_BASE est correcte.</small>`;
    document.getElementById('doDraw').disabled = true;
  }
});

async function drawOne(pool, onlyFree) {
  if (!onlyFree) {
    const g = pool[Math.floor(Math.random() * pool.length)];
    return { game: g, priceText: null };
  }

  // si onlyFree: on essaie plusieurs fois jusqu'à tomber sur un jeu gratuit
  for (let i = 0; i < 20; i++) {
    const g = pool[Math.floor(Math.random() * pool.length)];
    try {
      const res = await fetch(`${WORKER_BASE}/appdetails?appid=${g.appid}`);
      if (!res.ok) continue;
      const det = await res.json();
      const obj = det[g.appid] && det[g.appid].data ? det[g.appid].data : (det.data || null);
      if (!obj) continue;
      const isFree = !!obj.is_free || (obj.price_overview && obj.price_overview.final === 0);
      const priceText = isFree ? 'Gratuit' :
        obj.price_overview ? (obj.price_overview.final / 100).toFixed(2) + ' €' : 'Payant';
      if (isFree) return { game: g, priceText };
    } catch (_) {}
  }

  // fallback : n'importe quel jeu
  const g = pool[Math.floor(Math.random() * pool.length)];
  return { game: g, priceText: null };
}

document.getElementById('doDraw').addEventListener('click', async () => {
  const checkboxes = Array.from(elLib.querySelectorAll('input[type="checkbox"]'))
    .filter(c => c.checked);
  if (!checkboxes.length) {
    alert('Sélectionne au moins un jeu.');
    return;
  }

  const pool = checkboxes.map(c =>
    currentGames.find(g => String(g.appid) === String(c.dataset.appid))
  ).filter(Boolean);

  const onlyFree = document.getElementById('onlyFree').checked;
  elResult.innerHTML = '<small>Tirage en cours…</small>';

  const { game, priceText } = await drawOne(pool, onlyFree);
  const price = priceText ? ` (${priceText})` : '';

  elResult.innerHTML = `
    <h3>Résultat : ${escapeHtml(game.name)}${escapeHtml(price)}</h3>
    <p><a href="https://store.steampowered.com/app/${game.appid}" target="_blank">Voir sur Steam</a></p>
  `;
});
</script>
</body>
</html>
